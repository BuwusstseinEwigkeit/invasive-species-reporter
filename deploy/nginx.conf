# 外来物种哨兵 — Nginx 反向代理配置参考
# 用途：将 HTTPS 流量代理到 Node.js 后端
# 将此文件放入 /etc/nginx/sites-available/ 并软链接到 sites-enabled/

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    # SSL 证书路径（需从 CA 获取，如 Let's Encrypt）
    ssl_certificate /etc/ssl/certs/your-domain.com.pem;
    ssl_certificate_key /etc/ssl/private/your-domain.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # 静态资源缓存
    location /static/ {
        alias /path/to/invasive-species-reporter/server/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 上传文件访问
    location /uploads/ {
        alias /path/to/invasive-species-reporter/server/uploads/;
        expires 1d;
    }

    # API 反向代理
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        # WebSocket 支持（预留）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 请求体大小限制（给图片上传留余量）
    client_max_body_size 15m;

    # 访问和错误日志
    access_log /var/log/nginx/invasive-species-access.log;
    error_log /var/log/nginx/invasive-species-error.log;
}
