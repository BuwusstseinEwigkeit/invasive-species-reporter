version: "3.9"

services:
  # Python 识别微服务
  python-recognition:
    build:
      context: ./python-service
      dockerfile: Dockerfile
    container_name: invasive-species-python
    ports:
      - "5100:5100"
    environment:
      - PORT=5100
      - USE_PYTORCH=0
      - FLASK_DEBUG=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 5s
      retries: 3

